<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Capacitação em hard e soft skills baseada no Future of Jobs Report do Fórum Econômico Mundial." />
    <title>Altius Directio | Altius Inteligência</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Noise/grain overlay global */
      #root::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9998;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        mix-blend-mode: overlay;
      }

      /* Custom cursor */
      .cursor-dot,
      .cursor-ring {
        position: fixed;
        top: 0;
        left: 0;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        transition: transform 0.1s ease-out, width 0.3s ease-out, height 0.3s ease-out, opacity 0.2s ease-out;
      }
      .cursor-dot {
        width: 8px;
        height: 8px;
        background: #A99BFF;
        opacity: 0.8;
      }
      .cursor-ring {
        width: 40px;
        height: 40px;
        border: 1.5px solid rgba(169, 155, 255, 0.4);
        transition-duration: 0.15s;
      }
      .cursor-ring.expanded {
        width: 60px;
        height: 60px;
        border-color: rgba(169, 155, 255, 0.2);
      }

      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        .cursor-dot, .cursor-ring { display: none !important; }
        * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }

      /* Selection */
      ::selection { background: rgba(169, 155, 255, 0.3); color: #fff; }
      ::-moz-selection { background: rgba(169, 155, 255, 0.3); color: #fff; }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #050505; }
      ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; border: 2px solid #050505; }
      ::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
